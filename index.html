<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1D9E75">
<title>Daily Briefing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F5F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',Arial,sans-serif;color:#111}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #EBEBEB}
.top b{font-size:15px;font-weight:600;display:block}
.top small{font-size:11px;color:#999}
.sync{background:#F5F5F5;color:#888;font-size:11px;padding:4px 9px;border-radius:6px;border:0;font-family:inherit}
button.sync{cursor:pointer}
.bd{background:#F5F5F5;padding:12px;min-height:calc(100vh - 56px)}
.hero{background:#fff;border:1.5px solid #1D9E75;border-radius:12px;padding:12px 14px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:11px;color:#888;font-weight:500}
.date{font-size:20px;font-weight:700;margin-top:2px}
.date span{font-size:12px;font-weight:500;color:#0F6E56;margin-left:5px}
.tot{background:#F0FBF6;border-radius:8px;padding:7px 12px;text-align:center}
.tot i{font-style:normal;display:block;font-size:11px;color:#0F6E56;font-weight:500}
.tot b{font-size:16px;font-weight:700;color:#0F6E56}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.k{border-radius:8px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.k span{font-size:14px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;margin:16px 2px 6px}
.sh em{font-style:normal;font-weight:500;color:#999;font-size:11px}
.cd{background:#fff;border:1px solid #EBEBEB;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:9px;align-items:center}
.t{font-size:13px;line-height:1.45;flex:1;min-width:0;word-break:break-word}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.dn .t{color:#AAA;text-decoration:line-through}
.none{color:#999;font-size:13px}
.warn{background:#F2F3F5;color:#555;border-radius:10px;padding:9px 12px;margin-top:14px;font-size:12px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:#AAA;margin:18px 0 6px}
.foot a{color:#888;cursor:pointer;text-decoration:underline}
.lock{padding:40px 24px;text-align:center}
.lock .ic{width:60px;height:60px;border-radius:16px;background:#1D9E75;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.lock h1{font-size:17px;margin:0 0 6px}
.lock p{font-size:12px;color:#888;line-height:1.6;margin:0 0 18px}
.lock input{width:100%;border:1px solid #D0D0D0;border-radius:8px;padding:11px 12px;font-size:16px;font-family:inherit}
.lock button{width:100%;margin-top:10px;background:#1D9E75;color:#fff;border:0;border-radius:8px;padding:11px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.err{color:#B33025;font-size:12px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><b>Daily Briefing</b><small>업무 브리핑</small></div><div id="tr"></div></div>
  <div id="view" class="bd"></div>
</div>
<script>
(function () {
  var PW_KEY = 'briefing_pw', DATA_URL = 'data.enc.json';
  var TONE = {
    red: ['#FDECEA', '#F09595', '#B33025'],
    orange: ['#FEF3E2', '#EF9F27', '#905A08'],
    green: ['#EAF5DE', '#C0DD97', '#3A7A10'],
    done: ['#F1F5F0', '#D5E3CF', '#7C9A70'],
    gray: ['#F5F5F5', '#EBEBEB', '#888']
  };
  var view = document.getElementById('view'), tr = document.getElementById('tr');

  function el(tag, cls, text, style) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    if (style) e.style.cssText = style;
    return e;
  }
  function chip(text, tone) {
    var t = TONE[tone];
    return el('span', 'chip', text, 'background:' + t[0] + ';color:' + t[2]);
  }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function b64(s) {
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }

  async function decrypt(file, pw) {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(file.salt), iterations: file.iter, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(file.iv) }, key, b64(file.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  }

  async function open(pw) {
    var res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('data:' + res.status);
    var file = await res.json();
    try { return await decrypt(file, pw); } catch (e) { throw new Error('password'); }
  }

  function showLock(msg) {
    tr.textContent = '';
    view.textContent = '';
    var box = el('div', 'lock');
    var ic = el('div', 'ic');
    ic.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    box.appendChild(ic);
    box.appendChild(el('h1', '', '비밀번호를 입력하세요'));
    box.appendChild(el('p', '', '처음 한 번만 입력하면 이 기기에 저장되어 다음부터 바로 열립니다. 내용은 암호화되어 있어 비밀번호 없이는 볼 수 없습니다.'));
    var inp = el('input'); inp.type = 'password'; inp.autocomplete = 'current-password'; inp.placeholder = '비밀번호';
    var btn = el('button', '', '열기');
    var err = el('div', 'err', msg || '');
    box.appendChild(inp); box.appendChild(btn); box.appendChild(err);
    view.appendChild(box);
    async function go() {
      if (!inp.value) { err.textContent = '비밀번호를 입력하세요.'; return; }
      btn.disabled = true; err.textContent = '';
      try {
        var data = await open(inp.value);
        store(PW_KEY, inp.value);
        showMain(data);
      } catch (e) {
        btn.disabled = false;
        err.textContent = e.message === 'password' ? '비밀번호가 맞지 않습니다.' : '데이터를 불러오지 못했습니다. 잠시 후 다시 시도하세요.';
      }
    }
    btn.onclick = go;
    inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    inp.focus();
  }

  function section(tone, title, items, labels, opt) {
    var frag = document.createDocumentFragment(), t = TONE[tone];
    var head = el('div', 'sh', null, 'color:' + t[2]);
    var left = el('span', '', title);
    if (opt.note && items.length) left.appendChild(el('em', '', ' · ' + opt.note));
    head.appendChild(left);
    if (opt.right) head.appendChild(el('em', '', opt.right));
    frag.appendChild(head);
    if (!items.length) frag.appendChild(el('div', 'cd none', labels.none));
    items.forEach(function (it) {
      var row = el('div', it.done ? 'cd dn' : 'cd');
      row.appendChild(chip(it.badge, it.tone));
      row.appendChild(el('div', 't', it.text));
      if (it.repeat) row.appendChild(chip(labels.repeat, 'gray'));
      frag.appendChild(row);
    });
    return frag;
  }

  function showMain(d) {
    var L = d.labels;
    tr.textContent = '';
    var sync = el('span', 'sync', d.time + ' 기준');
    var rf = el('button', 'sync', '새로고침'); rf.onclick = function () { start(); };
    tr.style.cssText = 'display:flex;gap:6px';
    tr.appendChild(sync); tr.appendChild(rf);

    var pending = d.today.filter(function (x) { return !x.done; });
    var finished = d.today.filter(function (x) { return x.done; });
    var total = d.overdue.length + d.mails.length + pending.length;

    view.textContent = '';
    var hero = el('div', 'hero'), row = el('div', 'hrow'), left = el('div');
    left.appendChild(el('div', 'lbl', '오늘의 업무'));
    var dt = el('div', 'date', d.date); dt.appendChild(el('span', '', d.weekday + '요일'));
    left.appendChild(dt); row.appendChild(left);
    var tot = el('div', 'tot'); tot.appendChild(el('i', '', '처리 대기')); tot.appendChild(el('b', '', total + '건'));
    row.appendChild(tot); hero.appendChild(row);
    var kp = el('div', 'kp');
    [['red', L.overdue, d.overdue.length], ['orange', L.mail, d.mails.length], ['green', L.today, pending.length]].forEach(function (k) {
      var t = TONE[k[0]];
      var box = el('div', 'k', k[1], 'background:' + t[0] + ';border:1px solid ' + t[1] + ';color:' + t[2]);
      box.appendChild(el('span', '', String(k[2])));
      kp.appendChild(box);
    });
    hero.appendChild(kp); view.appendChild(hero);

    view.appendChild(section('red', L.overdue, d.overdue.map(function (x) {
      return { badge: x.date, tone: 'red', text: x.text, repeat: x.repeat };
    }), L, { note: L.note }));
    view.appendChild(section('orange', L.mail, d.mails.map(function (x) {
      return { badge: x.badge, tone: 'orange', text: x.subject };
    }), L, {}));
    var todo = pending.map(function (x) { return { badge: L.wait, tone: 'green', text: x.text, repeat: x.repeat }; })
      .concat(finished.map(function (x) { return { badge: L.done, tone: 'done', text: x.text, repeat: x.repeat, done: true }; }));
    view.appendChild(section('green', L.today, todo, L, { right: finished.length ? L.done + ' ' + finished.length + '건' : '' }));

    if (d.warnings && d.warnings.length) {
      var w = el('div', 'warn');
      d.warnings.forEach(function (m) { w.appendChild(el('div', '', '• ' + m)); });
      view.appendChild(w);
    }
    var foot = el('div', 'foot', '갱신 ' + d.generated + ' · ');
    var a = el('a', '', '저장된 비밀번호 지우기');
    a.onclick = function () { store(PW_KEY, null); showLock(''); };
    foot.appendChild(a); view.appendChild(foot);
  }

  async function start() {
    var pw = stored(PW_KEY);
    if (!pw) { showLock(''); return; }
    try { showMain(await open(pw)); }
    catch (e) { showLock(e.message === 'password' ? '저장된 비밀번호가 바뀌었습니다. 다시 입력하세요.' : '데이터를 불러오지 못했습니다. 잠시 후 다시 시도하세요.'); }
  }
  start();
})();
</script>
</body>
</html>
